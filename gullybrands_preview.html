<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gully Brands — Small brands. Made loud.</title>
  <style>
/* Marketing site styles — strict 3-colour brand (yellow + ink + cream) */
/* ============================================================
   GULLY BRANDS — colors & type tokens
   Mumbai shop board / auto-rickshaw / BEST bus.
   Strict 3-colour brand: Taxi Yellow + Jet Black + Cream.
   Tagline: Small brands. Made loud.
   ============================================================ */

/* ---------- FONTS ---------- */

/* ----- The only Fraunces we ship: the supplied 72pt SuperSoft Black Italic cut.
         No variable axes, no WONK/SOFT range, no Google-served alternates. ----- */

/* Registered as "Fraunces Billboard" — used explicitly via .t-billboard / wordmark. */
@font-face {
  font-family: "Fraunces Billboard";
  src: url("./fonts/Fraunces-72pt-SuperSoft-BlackItalic.ttf") format("truetype");
  font-weight: 900;
  font-style: italic;
  font-display: swap;
}

/* Also registered as plain "Fraunces" so any italic request for the serif family
   (tagline, italic display) hits this file. Upright Fraunces falls back to Georgia
   until more licensed weights are added. */
@font-face {
  font-family: "Fraunces";
  src: url("./fonts/Fraunces-72pt-SuperSoft-BlackItalic.ttf") format("truetype");
  font-weight: 400 900;
  font-style: italic;
  font-display: swap;
}

/* Inter (body) + JetBrains Mono (eyebrows). No Fraunces from Google. */
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap");

/* ============================================================
   COLOR TOKENS
   ============================================================ */
:root {
  /* ---- BRAND PALETTE — these three, and only these three.
         Never introduce a 4th brand colour without a written reason. ---- */
  --brand-yellow:   #FFC72C;  /* Taxi Yellow — primary brand colour */
  --brand-ink:      #0A0A0A;  /* Jet Black — all text on yellow/cream */
  --brand-cream:    #F4ECD8;  /* Cream — long-reading surfaces */

  /* Soft helpers — same hue, used only for hover/pressed states */
  --brand-yellow-deep: #E8AE15;  /* press / hover-darker on yellow */
  --brand-yellow-tint: #FFE38C;  /* faint yellow wash on cream */

  /* ---- LEGACY ALIASES (kept for prior generated files) ---- */
  --auto-yellow:     var(--brand-yellow);
  --auto-yellow-deep:var(--brand-yellow-deep);
  --auto-yellow-tint:var(--brand-yellow-tint);
  --ink:             var(--brand-ink);
  --shop-cream:      var(--brand-cream);

  /* ---- Functional accents — ONLY allowed inside infographics / UI states.
         Never as brand colour. Never in marketing collateral. ---- */
  --ui-success:     #1E6F4B;   /* green for "go" */
  --ui-danger:      #D7263D;   /* red for "warning" */
  --ui-info:        #143C8C;   /* blue for data points */
  --ui-warning:     #E8AE15;   /* warning yellow */

  /* ---- Surfaces ---- */
  --bg-paper:       var(--brand-cream);
  --bg-yellow:      var(--brand-yellow);
  --bg-ink:         var(--brand-ink);

  /* ---- Foreground roles ---- */
  --fg-1:           var(--brand-ink);      /* primary text */
  --fg-2:           #2B2418;               /* slightly softened ink — body copy on cream */
  --fg-3:           #6B5F4A;               /* tertiary, captions */
  --fg-on-ink:      var(--brand-cream);
  --fg-on-yellow:   var(--brand-ink);

  /* Never put yellow text on cream — contrast too low. Yellow text only on ink. */

  /* ---- Borders ---- */
  --line-ink:       var(--brand-ink);
  --line-soft:      rgba(10,10,10,0.18);
  --line-hair:      rgba(10,10,10,0.08);

  /* ---- Shadows ---- */
  /* Block / poster: flat hard offset, like a Marathi-cinema poster.
     Allowed on UI components (cards, buttons). NEVER on the logo itself. */
  --shadow-block-sm:  3px 3px 0 var(--brand-ink);
  --shadow-block:     5px 5px 0 var(--brand-ink);
  --shadow-block-lg:  8px 8px 0 var(--brand-ink);
  /* No drop shadows, no gradients, no glow on the logo, ever. */

  /* ============================================================
     TYPOGRAPHY
     ============================================================ */
  --font-display: "Fraunces Billboard", "Fraunces", Georgia, serif;
  --font-serif:   "Fraunces", Georgia, "Times New Roman", serif;
  --font-sans:    "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, Menlo, monospace;

  /* Type scale — block-poster scale, big headlines */
  --t-billboard:  clamp(72px, 12vw, 168px);
  --t-display:    clamp(56px, 8vw, 112px);
  --t-tagline:    clamp(28px, 3.4vw, 40px);
  --t-h1:         clamp(40px, 5vw, 64px);
  --t-h2:         clamp(30px, 3.6vw, 44px);
  --t-h3:         24px;
  --t-h4:         20px;
  --t-body-lg:    19px;
  --t-body:       17px;
  --t-body-sm:    15px;
  --t-caption:    13px;
  --t-micro:      11px;

  /* Line heights */
  --lh-tight:   0.95;
  --lh-snug:    1.1;
  --lh-normal:  1.5;
  --lh-loose:   1.65;

  /* ---- Radii ---- */
  --r-0: 0;
  --r-1: 4px;
  --r-2: 8px;
  --r-3: 14px;
  --r-4: 22px;
  --r-pill: 999px;

  /* ---- Spacing (4px base) ---- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;
  --s-9: 96px;
  --s-10: 128px;

  /* Legacy shadow aliases */
  --shadow-sticker-sm: var(--shadow-block-sm);
  --shadow-sticker:    var(--shadow-block);
  --shadow-sticker-lg: var(--shadow-block-lg);
}

/* ============================================================
   SEMANTIC TYPE CLASSES
   ============================================================ */

/* Wordmark — Fraunces Billboard (the supplied 72pt SuperSoft Black Italic).
   Reserved for the logo lockup and billboard moments.
   Letter-spacing stays at 0 — the supplied cut has built-in metrics. */
.t-billboard {
  font-family: var(--font-display);
  font-weight: 900;
  font-style: italic;
  font-size: var(--t-billboard);
  line-height: var(--lh-tight);
  letter-spacing: 0;
  color: var(--brand-ink);
}

/* Big display — used for slide titles & hero headlines */
.t-display {
  font-family: var(--font-display);
  font-weight: 900;
  font-style: italic;
  font-size: var(--t-display);
  line-height: var(--lh-tight);
  letter-spacing: 0;
}

/* Tagline — Fraunces Italic 500 for hero placements (per guidelines).
   "Small brands. Made loud." */
.t-tagline {
  font-family: var(--font-serif);
  font-weight: 500;
  font-style: italic;
  font-size: var(--t-tagline);
  line-height: 1.15;
  letter-spacing: -0.005em;
}

.t-h1 {
  font-family: var(--font-serif);
  font-weight: 800;
  font-size: var(--t-h1);
  line-height: var(--lh-snug);
  letter-spacing: -0.01em;
}
.t-h2 {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: var(--t-h2);
  line-height: var(--lh-snug);
  letter-spacing: -0.005em;
}
.t-h3 {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: var(--t-h3);
  line-height: 1.25;
  letter-spacing: -0.005em;
}
.t-h4 {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: var(--t-h4);
  line-height: 1.3;
}
.t-body-lg {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: var(--t-body-lg);
  line-height: var(--lh-normal);
}
.t-body {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: var(--t-body);
  line-height: var(--lh-normal);
}
.t-body-sm {
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: var(--t-body-sm);
  line-height: var(--lh-normal);
}
.t-caption {
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: var(--t-caption);
  line-height: 1.4;
}
.t-eyebrow {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: var(--t-micro);
  line-height: 1.4;
  text-transform: uppercase;
  letter-spacing: 0.14em;
}
.t-mono {
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: var(--t-body-sm);
  line-height: var(--lh-normal);
}

@import url("https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css");

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--brand-cream);
  color: var(--fg-1);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img { display: block; max-width: 100%; }
button { font: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* ---------- Layout ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }

/* ---------- Header ---------- */
.gb-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--brand-cream);
  border-bottom: 1.5px solid var(--brand-ink);
  height: 68px;
}
.gb-header .wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; }
.gb-logo { display: flex; align-items: center; gap: 12px; }
.gb-logo .mark {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--brand-yellow);
  border: 2px solid var(--brand-ink);
  display: grid; place-items: center;
  flex-shrink: 0;
  overflow: hidden;
}
.gb-logo .mark img { width: 100%; height: 100%; }
.gb-logo .name {
  font-family: var(--font-display);
  font-weight: 900; font-style: italic;
  font-size: 22px; line-height: 1;
  letter-spacing: 0;
  color: var(--brand-ink);
}
.gb-nav { display: flex; gap: 14px; align-items: center; }
.gb-nav a:not(:last-child) {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 14px;
  color: var(--brand-ink);
  background: var(--brand-cream);
  border: 2px solid var(--brand-ink);
  border-radius: 100px;
  padding: 8px 16px;
  line-height: 1;
  box-shadow: 3px 3px 0 var(--brand-ink);
  transition: transform .12s cubic-bezier(.2,.7,.3,1), box-shadow .12s, background .12s;
  display: inline-flex;
  align-items: center;
}
.gb-nav a:not(:last-child):hover {
  background: var(--brand-yellow-tint);
  transform: translate(-1px, -1px);
  box-shadow: 4px 4px 0 var(--brand-ink);
}
.gb-nav a:not(:last-child):active {
  background: var(--brand-yellow);
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0 var(--brand-ink);
}


/* ---------- Buttons ---------- */
.btn {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 15px;
  padding: 11px 20px;
  border: 2px solid var(--brand-ink);
  border-radius: 100px;
  line-height: 1;
  transition: transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s;
  background: var(--brand-yellow);
  color: var(--brand-ink);
  box-shadow: 4px 4px 0 var(--brand-ink);
  display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--brand-ink); }
.btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--brand-ink); }
.btn.ink   { background: var(--brand-ink); color: var(--brand-yellow); }
.btn.cream { background: var(--brand-cream); color: var(--brand-ink); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.lg    { padding: 14px 26px; font-size: 17px; box-shadow: 5px 5px 0 var(--brand-ink); }
.btn.lg:hover { box-shadow: 8px 8px 0 var(--brand-ink); }

/* ---------- Hero ---------- */
.gb-hero {
  background: var(--brand-yellow);
  border-bottom: 1.5px solid var(--brand-ink);
  padding: 80px 0 100px;
  position: relative;
  overflow: hidden;
}
.gb-hero .eye {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--brand-ink);
  margin-bottom: 28px;
  display: flex; gap: 14px; align-items: center;
}
.gb-hero .eye .dot { width: 8px; height: 8px; background: var(--brand-ink); border-radius: 50%; }
.gb-hero h1 {
  font-family: var(--font-display);
  font-weight: 900; font-style: italic;
  font-size: clamp(64px, 11vw, 140px);
  line-height: 0.94;
  letter-spacing: 0;
  color: var(--brand-ink);
  max-width: 12ch;
}
.gb-hero h1 em { font-style: italic; color: inherit; }
.gb-hero .sub {
  font-family: var(--font-sans);
  font-size: 19px;
  line-height: 1.45;
  color: var(--brand-ink);
  max-width: 56ch;
  margin-top: 28px;
  opacity: 0.85;
}
.gb-hero .tag {
  font-family: var(--font-serif);
  font-weight: 500;
  font-style: italic;
  font-size: 26px;
  color: var(--brand-ink);
  margin-top: 18px;
  opacity: 0.9;
}
.gb-hero .cta-row { display: flex; gap: 16px; margin-top: 40px; }

/* Hero stamp — ink on ink shadow */
.hero-stamp {
  position: absolute;
  top: 92px; right: 60px;
  background: var(--brand-ink);
  color: var(--brand-yellow);
  padding: 14px 18px;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  transform: rotate(6deg);
  border: 2px solid var(--brand-ink);
  box-shadow: 4px 4px 0 var(--brand-yellow-deep);
  line-height: 1.4;
  text-align: center;
}
.hero-stamp .num { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 30px; letter-spacing: 0; display: block; color: var(--brand-yellow); }

/* ---------- Section header ---------- */
.section { padding: 96px 0; border-bottom: 1.5px solid var(--brand-ink); }
.section.cream  { background: var(--brand-cream); }
.section.ink    { background: var(--brand-ink); color: var(--fg-on-ink); }
.section.yellow { background: var(--brand-yellow); }

.s-eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-3);
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 20px;
}
.section.ink .s-eyebrow { color: var(--brand-yellow); }
.s-eyebrow .bar { width: 30px; height: 1.5px; background: currentColor; }
.s-title {
  font-family: var(--font-serif);
  font-weight: 800;
  font-style: italic;
  font-size: clamp(38px, 4.6vw, 56px);
  line-height: 1.05;
  letter-spacing: 0;
  color: currentColor;
  max-width: 18ch;
}
.section.ink .s-title { color: var(--brand-cream); }
.s-lede {
  font-family: var(--font-sans);
  font-size: 18px;
  line-height: 1.5;
  color: var(--fg-2);
  max-width: 56ch;
  margin-top: 18px;
}
.section.ink .s-lede { color: var(--brand-cream); opacity: 0.85; }
.section.yellow .s-eyebrow { color: var(--brand-ink); opacity: 0.7; }
.section.yellow .s-lede { color: var(--brand-ink); opacity: 0.8; }

/* ---------- What I do — 3 stickers ---------- */
.do-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  margin-top: 52px;
}
.do-card {
  background: var(--brand-cream);
  border: 2px solid var(--brand-ink);
  border-radius: var(--r-3);
  box-shadow: 5px 5px 0 var(--brand-ink);
  padding: 28px;
  display: flex; flex-direction: column; gap: 14px;
  transition: transform .16s, box-shadow .16s;
}
.do-card:hover { transform: translate(-2px,-2px); box-shadow: 8px 8px 0 var(--brand-ink); }
.do-card.yel { background: var(--brand-yellow); }
.do-card.ink { background: var(--brand-ink); color: var(--brand-cream); }
.do-card .icn {
  width: 48px; height: 48px;
  border: 2px solid var(--brand-ink);
  border-radius: var(--r-2);
  display: grid; place-items: center;
  font-size: 24px;
  background: var(--brand-yellow);
  color: var(--brand-ink);
  align-self: flex-start;
}
.do-card.ink .icn { border-color: var(--brand-yellow); }
.do-card h3 {
  font-family: var(--font-serif);
  font-weight: 800; font-style: italic;
  font-size: 28px;
  line-height: 1.05;
  letter-spacing: 0;
}
.do-card.ink h3 { color: var(--brand-yellow); }
.do-card p {
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  opacity: 0.85;
}
.do-card .px {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border-top: 1.5px solid currentColor;
  padding-top: 12px;
  margin-top: auto;
  opacity: 0.7;
}

/* ---------- Work grid ---------- */
.work-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 28px;
  margin-top: 52px;
}
.case {
  border: 2px solid var(--brand-ink);
  border-radius: var(--r-3);
  background: var(--brand-cream);
  overflow: hidden;
  box-shadow: 5px 5px 0 var(--brand-ink);
  transition: transform .16s, box-shadow .16s;
  display: flex; flex-direction: column;
  cursor: pointer;
}
.case:hover { transform: translate(-3px,-3px); box-shadow: 9px 9px 0 var(--brand-ink); }
.case .thumb {
  height: 220px;
  display: grid; place-items: center;
  border-bottom: 1.5px solid var(--brand-ink);
  position: relative;
  overflow: hidden;
}
.case .thumb .case-video,
.case .thumb .case-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}
.case .thumb .case-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(10, 10, 10, 0.42);
  z-index: 2;
  transition: background 0.16s ease;
}
.case:hover .thumb .case-overlay {
  background: rgba(10, 10, 10, 0.3);
}
.case .thumb .label {
  font-family: var(--font-display);
  font-weight: 900; font-style: italic;
  font-size: 58px;
  line-height: 0.9;
  letter-spacing: 0;
  text-align: center;
  padding: 0 20px;
  position: relative;
  z-index: 3;
  color: #ffffff;
  text-shadow: 2px 2px 0 var(--brand-ink);
}
.case .thumb .stamp {
  position: absolute; top: 16px; right: 16px;
  background: var(--brand-ink); color: var(--brand-yellow);
  padding: 5px 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border: 1.5px solid var(--brand-yellow);
  z-index: 3;
}
.case .meta { padding: 22px 26px 24px; display: flex; flex-direction: column; gap: 8px; }
.case .cat {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.case h4 {
  font-family: var(--font-serif);
  font-weight: 800; font-style: italic;
  font-size: 28px;
  line-height: 1.05;
  letter-spacing: 0;
  color: var(--brand-ink);
}
.case p {
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  color: var(--fg-2);
}
.case .stats {
  display: flex; gap: 20px;
  margin-top: 6px;
  border-top: 1.5px solid var(--line-soft);
  padding-top: 14px;
}
.case .stat .n {
  font-family: var(--font-display);
  font-weight: 900; font-style: italic;
  font-size: 26px;
  color: var(--brand-ink);
  line-height: 1;
}
.case .stat .l {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-top: 4px;
}

/* Case thumb palettes — yellow / ink / cream only */
.t-yel    { background: var(--brand-yellow); color: var(--brand-ink); }
.t-ink    { background: var(--brand-ink);    color: var(--brand-yellow); }
.t-cream  { background: var(--brand-cream);  color: var(--brand-ink); }
/* Stripes — alternative cover treatments */
.t-stripe-yel {
  background:
    repeating-linear-gradient(135deg, var(--brand-ink) 0 18px, var(--brand-yellow) 18px 60px);
  color: var(--brand-ink);
}
.t-stripe-cream {
  background:
    repeating-linear-gradient(135deg, var(--brand-cream) 0 18px, var(--brand-yellow) 18px 60px);
  color: var(--brand-ink);
}

/* ---------- Pricing (ink section) ---------- */
.price-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
  margin-top: 52px;
}
.price {
  border: 2px solid var(--brand-yellow);
  background: transparent;
  border-radius: var(--r-3);
  padding: 28px;
  display: flex; flex-direction: column; gap: 16px;
  color: var(--brand-cream);
}
.price.featured {
  background: var(--brand-yellow);
  color: var(--brand-ink);
  border-color: var(--brand-yellow);
  box-shadow: 6px 6px 0 var(--brand-cream);
  position: relative;
}
.price.featured .featured-tag {
  position: absolute; top: -14px; left: 24px;
  background: var(--brand-ink); color: var(--brand-yellow);
  padding: 4px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;

</script>
  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [active, setActive] = useState("work");
      const onNav = (k) => {
        setActive(k);
        const el = document.getElementById(k === "home" ? "" : k);
        if (el) {
          const top = el.getBoundingClientRect().top + window.scrollY - 80;
          window.scrollTo({ top, behavior: "smooth" });
        } else if (k === "home") {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      };
      return (
        <React.Fragment>
          <Header active={active} onNav={onNav} />
          <main>
            <Hero />
            <WhatIDo />
            <Work />
            <Pricing />
            <About />
            <Contact />
          </main>
          <Footer />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
