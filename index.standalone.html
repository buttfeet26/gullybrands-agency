<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gully Brands — Small brands. Made loud.</title>

  <!-- Resources referenced inside JSX code (not as HTML attributes) — bundler must inline these -->
  <meta name="ext-resource-dependency" content="assets/logo-square-yellow.png" data-resource-id="logoYellow" />

  <link rel="stylesheet" href="site_v6.css">

  <!-- Splash thumbnail (shown while assets unpack, also no-JS fallback) -->
  <template id="__bundler_thumbnail" data-bg-color="#FFC72C">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#FFC72C"/>
      <g transform="translate(600 400)">
        <text text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="900"
              font-size="220" fill="#0A0A0A" letter-spacing="-6" y="-30">Gully</text>
        <text text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="900"
              font-size="220" fill="#0A0A0A" letter-spacing="-6" y="180">Brands</text>
      </g>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components.standalone.jsx"></script>
  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [active, setActive] = useState("work");
      const onNav = (k) => {
        setActive(k);
        const el = document.getElementById(k === "home" ? "" : k);
        if (el) {
          const top = el.getBoundingClientRect().top + window.scrollY - 80;
          window.scrollTo({ top, behavior: "smooth" });
        } else if (k === "home") {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      };
      return (
        <React.Fragment>
          <Header active={active} onNav={onNav} />
          <main>
            <Hero />
            <WhatIDo />
            <Work />
            <Pricing />
            <About />
            <Contact />
          </main>
          <Footer />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
